<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — ElementLab</title>
<style>
  :root {
    --ink: #0F2A2E;
    --paper: #F3F6F5;
    --line: #C9D6D3;
    --teal: #0F6B60;
    --teal-dark: #0A4B43;
    --amber: #E8963C;
    --error: #B4432E;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
  }

  .screen {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(15, 42, 46, 0.06);
  }

  header {
    padding: 36px 28px 24px;
    border-bottom: 1px solid var(--line);
  }

  .mark {
    font-family: 'Georgia', serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--teal);
    margin: 0 0 14px;
  }

  h1 {
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 8px;
    font-weight: 600;
    color: var(--ink);
  }

  .sub {
    font-size: 14px;
    color: #5B6E6C;
    margin: 0;
    line-height: 1.5;
  }

  form {
    padding: 28px;
    flex: 1;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 28px;
  }

  legend {
    font-size: 12px;
    font-weight: 600;
    color: var(--teal-dark);
    letter-spacing: 0.03em;
    padding: 0 0 12px;
    width: 100%;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="date"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
  }

  input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(15, 107, 96, 0.15);
  }

  input.invalid {
    border-color: var(--error);
  }

  .error-text {
    display: none;
    font-size: 12px;
    color: var(--error);
    margin-top: 6px;
  }

  .field.has-error .error-text {
    display: block;
  }

  .row {
    display: flex;
    gap: 12px;
  }

  .row .field {
    flex: 1;
  }

  button[type="submit"] {
    width: 100%;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
    background: var(--teal);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button[type="submit"]:hover {
    background: var(--teal-dark);
  }

  button[type="submit"]:active {
    transform: scale(0.99);
  }

  button[type="submit"]:disabled {
    background: #A9B8B6;
    cursor: not-allowed;
  }

  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    display: none;
  }

  .status.show {
    display: block;
  }

  .status.success {
    background: rgba(15, 107, 96, 0.1);
    color: var(--teal-dark);
    border: 1px solid rgba(15, 107, 96, 0.25);
  }

  .status.failure {
    background: rgba(180, 67, 46, 0.08);
    color: var(--error);
    border: 1px solid rgba(180, 67, 46, 0.25);
  }

  footer {
    padding: 16px 28px 28px;
    font-size: 12px;
    color: #8B9C9A;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="screen">
    <header>
      <p class="mark">ElementLab</p>
      <h1>Create your account</h1>
      <p class="sub">Tell us a bit about yourself to get started.</p>
    </header>

    <form id="registrationForm" novalidate>
      <fieldset>
        <legend>Personal details</legend>

        <div class="field" id="field-name">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Juan Dela Cruz" autocomplete="name" />
          <p class="error-text">Enter your full name.</p>
        </div>

        <div class="field" id="field-birthdate">
          <label for="birthdate">Birthdate</label>
          <input type="date" id="birthdate" name="birthdate" max="" />
          <p class="error-text">Select your birthdate.</p>
        </div>
      </fieldset>

      <fieldset>
        <legend>Address</legend>

        <div class="field" id="field-street">
          <label for="street">Street</label>
          <input type="text" id="street" name="street" placeholder="123 Rizal St." autocomplete="address-line1" />
          <p class="error-text">Enter your street address.</p>
        </div>

        <div class="row">
          <div class="field" id="field-city">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Antipolo" autocomplete="address-level2" />
            <p class="error-text">Required.</p>
          </div>
          <div class="field" id="field-province">
            <label for="province">Province</label>
            <input type="text" id="province" name="province" placeholder="Rizal" autocomplete="address-level1" />
          </div>
        </div>

        <div class="row">
          <div class="field" id="field-zip">
            <label for="zipCode">Zip code</label>
            <input type="text" id="zipCode" name="zipCode" placeholder="1870" inputmode="numeric" autocomplete="postal-code" />
          </div>
          <div class="field" id="field-country">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" value="Philippines" autocomplete="country-name" />
          </div>
        </div>
      </fieldset>

      <button type="submit" id="submitBtn">Create account</button>

      <div class="status" id="statusBox"></div>
    </form>

    <footer>Your details are sent securely to ElementLab's servers.</footer>
  </div>

<script>
  // Point this at your backend API.
  // - Testing in a desktop browser on the same machine as the backend: localhost works.
  // - Testing from a phone browser on the same Wi-Fi: use your computer's LAN IP,
  //   e.g. http://192.168.1.5:3000
  const API_BASE_URL = 'http://localhost:3000';

  const form = document.getElementById('registrationForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');
  const birthdateInput = document.getElementById('birthdate');

  // Don't allow picking a birthdate in the future
  birthdateInput.max = new Date().toISOString().split('T')[0];

  function setFieldError(fieldId, hasError) {
    const field = document.getElementById(fieldId);
    const input = field.querySelector('input');
    field.classList.toggle('has-error', hasError);
    input.classList.toggle('invalid', hasError);
  }

  function validate() {
    const name = document.getElementById('name').value.trim();
    const birthdate = birthdateInput.value;
    const street = document.getElementById('street').value.trim();
    const city = document.getElementById('city').value.trim();

    let valid = true;

    setFieldError('field-name', !name);
    if (!name) valid = false;

    setFieldError('field-birthdate', !birthdate);
    if (!birthdate) valid = false;

    setFieldError('field-street', !street);
    if (!street) valid = false;

    setFieldError('field-city', !city);
    if (!city) valid = false;

    return valid;
  }

  function showStatus(message, kind) {
    statusBox.textContent = message;
    statusBox.className = 'status show ' + kind;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.className = 'status';

    if (!validate()) {
      showStatus('Please fill in the highlighted fields.', 'failure');
      return;
    }

    const payload = {
      name: document.getElementById('name').value.trim(),
      birthdate: new Date(birthdateInput.value).toISOString(),
      address: {
        street: document.getElementById('street').value.trim(),
        city: document.getElementById('city').value.trim(),
        province: document.getElementById('province').value.trim(),
        zipCode: document.getElementById('zipCode').value.trim(),
        country: document.getElementById('country').value.trim(),
      },
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    try {
      const response = await fetch(`${API_BASE_URL}/api/users/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Registration failed.');
      }

      showStatus('Account created. Welcome to ElementLab!', 'success');
      form.reset();
      document.getElementById('country').value = 'Philippines';
    } catch (err) {
      showStatus(err.message || 'Something went wrong. Please try again.', 'failure');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>

</body>
</html>
